[package]
name = "hermeticacomms"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust client for the Hermetica API: one async method per operation, idempotency keys, retries, cursor paging."
license = "MIT"
repository = "https://github.com/hermeticacomms/hermetica-rust"
readme = "README.md"
keywords = ["hermetica", "email", "sms", "outreach", "api"]
categories = ["api-bindings", "web-programming::http-client"]

[lib]
name = "hermetica"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
