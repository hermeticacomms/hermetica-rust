# Push a tag matching the version in Cargo.toml ("v0.1.0") to publish the "hermeticacomms" crate to crates.io.
# Uses crates.io trusted publishing (GitHub OIDC, no long-lived token). One-time setup: publish the first version by hand
# (cargo publish), then on crates.io under the crate's Settings > Trusted Publishing add repository hermeticacomms/hermetica-rust,
# workflow release.yml, environment crates-io.
name: release
on:
  push: { tags: ['v*'] }
permissions: { contents: read }
jobs:
  release:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "$GITHUB_REF_NAME"
      - run: cargo test
      - run: cargo package
      - uses: actions/attest-build-provenance@v3
        with: { subject-path: 'target/package/hermeticacomms-*.crate' }
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env: { CARGO_REGISTRY_TOKEN: '${{ steps.auth.outputs.token }}' }
      - run: gh release create "$GITHUB_REF_NAME" target/package/hermeticacomms-*.crate --repo "$GITHUB_REPOSITORY" --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }
